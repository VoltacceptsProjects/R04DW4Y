<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>R04DW4Y</title>
    <style>
        @font-face {
            font-family: 'Default';
            src: url('Data/Fonts/default.ttf') format('truetype');
            font-display: swap;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            height: 100%;
            background: #000;
            font-family: 'Default', monospace;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #screen {
            position: relative;
            width: min(100vw, 800px);
            aspect-ratio: 4 / 3;
        }

        #canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
            background: #000;
            cursor: none;
        }

        #crosshair-cursor {
            position: absolute;
            width: 24px;
            height: 24px;
            margin: 0;
            pointer-events: none;
            transition: opacity 0.15s;
            opacity: 0;
            z-index: 3;
            image-rendering: pixelated;
        }
        #crosshair-cursor.active {
            opacity: 1;
        }

        #loading {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            font-size: 14px;
            letter-spacing: 2px;
            color: #cfcbc2;
            text-transform: uppercase;
            background: #000;
        }
        #loading::after {
            content: '';
            display: inline-block;
            width: 1ch;
            animation: dots 1.2s steps(4, end) infinite;
            overflow: hidden;
        }
        @keyframes dots {
            0% { content: ''; }
            25% { content: '.'; }
            50% { content: '..'; }
            75% { content: '...'; }
            100% { content: ''; }
        }
    </style>
</head>
<body>
    <div id="screen">
        <canvas id="canvas" width="800" height="600"></canvas>
        <img id="crosshair-cursor" src="" alt="crosshair">
        <p id="loading">Loading game</p>
    </div>

    <script src="./game.js"></script>
</body>
</html>
